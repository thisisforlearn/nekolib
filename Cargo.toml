[package]
name = "nekolib"
version = "0.1.0"
edition = "2021"
authors = ["Vaibhav <vaibhav@nekolib.dev>"]
description = "NekoLib — Pure-CPU Portable Layer-1 Blockchain. Lightweight, ASIC-resistant, zero-cloud. Runs on x86_64 Linux/Windows, ARM64 SBCs, Android (Termux/NDK) & iOS."
license = "GPL-3.0"
repository = "https://github.com/thisisforlearn/nekolib"
homepage = "https://github.com/thisisforlearn/nekolib"
documentation = "https://github.com/thisisforlearn/nekolib#readme"
keywords = ["blockchain", "blake3", "p2p", "embedded", "portable"]
categories = ["cryptography", "database"]
readme = "README.md"

[lib]
name = "nekolib"
path = "src/lib.rs"

[[bin]]
name = "nekod"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
rand_core = "0.6"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"

# lightweight, no async runtime, no tokio, pure std::net

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
panic = "abort"

[profile.mobile]
inherits = "release"
opt-level = "z"        # optimize for binary size (<10MB)
lto = true
codegen-units = 1
panic = "abort"
strip = true

